<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Architecture reseau multi-site WatchGuard : SITE1-MG siege, SITE2-MG, SITE3-MG, SITE4-MU, tunnels IPsec et journalisation Dimension">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c34"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4002b"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e4002b"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#131d34" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <style>
    .f  { font-family: "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif; }
    .t  { fill: #e8eefb; }
    .m  { fill: #8ba1c6; }
    .s  { fill: #6d84ab; }
    .b  { font-weight: 700; }
    .chip { fill: #16233f; stroke: #2c3f66; stroke-width: 1; }
    .card { fill: url(#cardg); stroke: #2a3b60; stroke-width: 1.5; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes flowv { to { stroke-dashoffset: -40; } }
    .tunnel   { animation: flow 1.1s linear infinite; }
    .logline  { animation: flowv 1.6s linear infinite; }
    .backup   { animation: flow 3s linear infinite; }
    @keyframes halo {
      0%, 100% { opacity: .18; transform: scale(1); }
      50%      { opacity: .55; transform: scale(1.05); }
    }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .live { animation: blink 1.4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
    .sweep { transform-box: fill-box; transform-origin: center; animation: sweep 2.4s ease-in-out infinite alternate; }
  </style>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect width="1200" height="820" fill="url(#grid)" opacity=".55"/>

  <!-- titre -->
  <g class="f">
    <rect x="40" y="34" width="6" height="44" rx="3" fill="url(#accent)"/>
    <text x="60" y="56" class="t b" font-size="23">ARCHITECTURE RÉSEAU MULTI-SITE — WATCHGUARD</text>
    <text x="60" y="78" class="s" font-size="13">SITE1-MG · SITE2-MG · SITE3-MG · SITE4-MU — IPsec, SD-WAN multi-FAI, WebBlocker, Dimension</text>

    <!-- legende -->
    <g transform="translate(742,96)">
      <rect x="0" y="0" width="418" height="30" rx="15" fill="#0a1222" stroke="#22314f"/>
      <line x1="16" y1="15" x2="48" y2="15" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 5" class="tunnel"/>
      <text x="56" y="19" class="m" font-size="11">Tunnel IPsec actif</text>
      <line x1="176" y1="15" x2="208" y2="15" stroke="#f5a524" stroke-width="3" stroke-dasharray="8 5" class="backup"/>
      <text x="216" y="19" class="m" font-size="11">Secours FAI (Starlink)</text>
      <circle cx="352" cy="15" r="5" fill="#e4002b" class="live"/>
      <text x="364" y="19" class="m" font-size="11">Logs</text>
    </g>
  </g>

  <!-- ================= TUNNELS ================= -->
  <g fill="none" stroke-linecap="round">
    <!-- halos -->
    <path d="M460,380 C400,350 350,310 290,258" stroke="#22d3ee" stroke-width="10" opacity=".22" filter="url(#soft)"/>
    <path d="M740,380 C800,350 850,310 910,258" stroke="#22d3ee" stroke-width="10" opacity=".22" filter="url(#soft)"/>
    <path d="M460,460 C400,480 350,500 290,540" stroke="#22d3ee" stroke-width="10" opacity=".22" filter="url(#soft)"/>

    <!-- tunnels principaux -->
    <path id="t1" d="M460,380 C400,350 350,310 290,258" stroke="#22d3ee" stroke-width="3.5" stroke-dasharray="12 6" class="tunnel"/>
    <path id="t2" d="M740,380 C800,350 850,310 910,258" stroke="#22d3ee" stroke-width="3.5" stroke-dasharray="12 6" class="tunnel"/>
    <path id="t3" d="M460,460 C400,480 350,500 290,540" stroke="#22d3ee" stroke-width="3.5" stroke-dasharray="12 6" class="tunnel"/>

    <!-- chemin de secours multi-FAI -->
    <path id="t5" d="M462,478 C410,505 355,530 294,570" stroke="#f5a524" stroke-width="2.5" stroke-dasharray="10 8" class="backup" opacity=".9"/>

    <!-- flux de logs vers Dimension -->
    <path id="t6" d="M600,495 L600,655" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 7" class="logline"/>
  </g>

  <!-- etiquettes tunnels -->
  <g class="f">
    <g transform="translate(344,296)">
      <rect x="0" y="0" width="84" height="20" rx="10" fill="#0a1222" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="42" y="14" text-anchor="middle" fill="#7fe7f5" font-size="10.5">BOVPN · B1</text>
    </g>
    <g transform="translate(780,296)">
      <rect x="0" y="0" width="84" height="20" rx="10" fill="#0a1222" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="42" y="14" text-anchor="middle" fill="#7fe7f5" font-size="10.5">BOVPN · B3</text>
    </g>
    <g transform="translate(336,466)">
      <rect x="0" y="0" width="84" height="20" rx="10" fill="#0a1222" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="42" y="14" text-anchor="middle" fill="#7fe7f5" font-size="10.5">BOVPN · B2</text>
    </g>
    <g transform="translate(306,578)">
      <rect x="0" y="0" width="118" height="20" rx="10" fill="#0a1222" stroke="#f5a524" stroke-opacity=".5"/>
      <text x="59" y="14" text-anchor="middle" fill="#f7c66b" font-size="10.5">secours Starlink</text>
    </g>
    <g transform="translate(610,558)">
      <rect x="0" y="0" width="132" height="20" rx="10" fill="#0a1222" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="66" y="14" text-anchor="middle" fill="#c4b5fd" font-size="10.5">syslog → Dimension</text>
    </g>
  </g>

  <!-- paquets en transit -->
  <g filter="url(#glow)">
    <circle r="6" fill="#22d3ee">
      <animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#t1"/></animateMotion>
    </circle>
    <circle r="6" fill="#22d3ee">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#t2"/></animateMotion>
    </circle>
    <circle r="6" fill="#22d3ee">
      <animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath xlink:href="#t3"/></animateMotion>
    </circle>
    <circle r="5" fill="#a78bfa">
      <animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#t6"/></animateMotion>
    </circle>
    <circle r="4" fill="#a78bfa">
      <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#t6"/></animateMotion>
    </circle>
  </g>

  <!-- ================= SITE1-MG (SIEGE) ================= -->
  <g class="f">
    <rect x="452" y="337" width="296" height="166" rx="20" fill="#e4002b" opacity=".35" class="halo"/>
    <rect x="460" y="345" width="280" height="150" rx="16" class="card"/>
    <rect x="460" y="345" width="280" height="4" rx="2" fill="url(#accent)"/>
    <rect x="476" y="361" width="18" height="18" rx="4" fill="#e4002b"/>
    <text x="485" y="374" text-anchor="middle" class="t b" font-size="11">W</text>
    <text x="502" y="376" class="t b" font-size="15.5">SITE1-MG · SIÈGE M390</text>
    <text x="476" y="400" class="m" font-size="11.5">Fireware 12.11 · WatchGuard Cloud</text>

    <rect x="476" y="412" width="118" height="22" rx="11" class="chip"/>
    <text x="535" y="427" text-anchor="middle" class="m" font-size="10.5">FO-TELMA (FO)</text>
    <rect x="602" y="412" width="124" height="22" rx="11" class="chip"/>
    <text x="664" y="427" text-anchor="middle" class="m" font-size="10.5">FH-ORANGE (FH)</text>

    <rect x="476" y="442" width="118" height="22" rx="11" class="chip"/>
    <text x="535" y="457" text-anchor="middle" class="m" font-size="10.5">STARLINK (secours)</text>
    <rect x="602" y="442" width="124" height="22" rx="11" class="chip"/>
    <text x="664" y="457" text-anchor="middle" class="m" font-size="10.5">BGP → BOVPN VIF</text>

    <circle cx="482" cy="478" r="5" fill="#22c55e" class="live"/>
    <text x="494" y="482" class="m" font-size="11">3 tunnels établis · SD-WAN 3 FAI</text>
  </g>

  <!-- ================= SITE2-MG ================= -->
  <g class="f">
    <rect x="50" y="170" width="240" height="128" rx="16" class="card"/>
    <rect x="50" y="170" width="240" height="4" rx="2" fill="#22d3ee"/>
    <rect x="64" y="184" width="16" height="16" rx="4" fill="#e4002b"/>
    <text x="72" y="196" text-anchor="middle" class="t b" font-size="10">W</text>
    <text x="88" y="197" class="t b" font-size="14">SITE2-MG · AGENCE</text>
    <text x="64" y="219" class="m" font-size="11">Firebox T20 · 200 Mb/s</text>
    <text x="64" y="241" class="s" font-size="10">FO-TELMA · FH-ORANGE · STARLINK</text>
    <rect x="64" y="252" width="104" height="20" rx="10" class="chip"/>
    <text x="116" y="266" text-anchor="middle" class="m" font-size="10">10.20.0.0/16</text>
    <rect x="174" y="252" width="102" height="20" rx="10" class="chip"/>
    <text x="225" y="266" text-anchor="middle" class="m" font-size="10">SD-WAN 3 FAI</text>
    <circle cx="70" cy="286" r="4.5" fill="#22c55e" class="live"/>
    <text x="82" y="290" class="s" font-size="10.5">Tunnel actif · IKEv2 / AES-256-GCM</text>
  </g>

  <!-- ================= SITE4-MU ================= -->
  <g class="f">
    <rect x="910" y="170" width="240" height="128" rx="16" class="card"/>
    <rect x="910" y="170" width="240" height="4" rx="2" fill="#a78bfa"/>
    <rect x="924" y="184" width="16" height="16" rx="4" fill="#e4002b"/>
    <text x="932" y="196" text-anchor="middle" class="t b" font-size="10">W</text>
    <text x="948" y="197" class="t b" font-size="14">SITE4-MU · MAURICE</text>
    <text x="924" y="219" class="m" font-size="11">Firebox T20 · liaison inter-sites</text>
    <text x="924" y="241" class="s" font-size="10">Emtel · my.t</text>
    <rect x="924" y="252" width="104" height="20" rx="10" class="chip"/>
    <text x="976" y="266" text-anchor="middle" class="m" font-size="10">10.40.0.0/16</text>
    <rect x="1034" y="252" width="102" height="20" rx="10" class="chip"/>
    <text x="1085" y="266" text-anchor="middle" class="m" font-size="10">SD-WAN 2 FAI</text>
    <circle cx="930" cy="286" r="4.5" fill="#22c55e" class="live"/>
    <text x="942" y="290" class="s" font-size="10.5">Tunnel international · IKEv2</text>
  </g>

  <!-- ================= SITE3-MG ================= -->
  <g class="f">
    <rect x="50" y="500" width="240" height="128" rx="16" class="card"/>
    <rect x="50" y="500" width="240" height="4" rx="2" fill="#f5a524"/>
    <rect x="64" y="514" width="16" height="16" rx="4" fill="#e4002b"/>
    <text x="72" y="526" text-anchor="middle" class="t b" font-size="10">W</text>
    <text x="88" y="527" class="t b" font-size="14">SITE3-MG · PRODUCTION</text>
    <text x="64" y="549" class="m" font-size="11">Firebox M290 · 500 Mb/s</text>
    <text x="64" y="571" class="s" font-size="10">FO-TELMA · FH-ORANGE · STARLINK</text>
    <rect x="64" y="582" width="104" height="20" rx="10" class="chip"/>
    <text x="116" y="596" text-anchor="middle" class="m" font-size="10">10.30.0.0/16</text>
    <rect x="174" y="582" width="102" height="20" rx="10" class="chip"/>
    <text x="225" y="596" text-anchor="middle" class="m" font-size="10">VLAN MES/IT/OT</text>
    <circle cx="70" cy="616" r="4.5" fill="#22c55e" class="live"/>
    <text x="82" y="620" class="s" font-size="10.5">Tunnel actif · segmentation OT</text>
  </g>

  <!-- ================= DIMENSION ================= -->
  <g class="f">
    <rect x="470" y="655" width="260" height="90" rx="16" class="card"/>
    <rect x="470" y="655" width="260" height="4" rx="2" fill="#a78bfa"/>
    <text x="486" y="682" class="t b" font-size="14">WATCHGUARD DIMENSION</text>
    <text x="486" y="700" class="m" font-size="11">VM · logs 30 j · rapports · WebBlocker</text>
    <g fill="url(#bar)">
      <rect x="486" y="726" width="14" height="10" rx="3">
        <animate attributeName="height" values="10;26;14;30;16" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="736;720;732;716;730" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="508" y="720" width="14" height="16" rx="3">
        <animate attributeName="height" values="22;12;30;14;26" dur="2.8s" begin=".3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="724;734;716;732;720" dur="2.8s" begin=".3s" repeatCount="indefinite"/>
      </rect>
      <rect x="530" y="726" width="14" height="10" rx="3">
        <animate attributeName="height" values="14;30;10;24;32" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="732;716;736;722;714" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
      </rect>
      <rect x="552" y="722" width="14" height="14" rx="3">
        <animate attributeName="height" values="28;16;22;32;12" dur="2.8s" begin=".9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="718;730;724;714;734" dur="2.8s" begin=".9s" repeatCount="indefinite"/>
      </rect>
      <rect x="574" y="726" width="14" height="10" rx="3">
        <animate attributeName="height" values="18;28;12;26;20" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="728;718;734;720;726" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g class="sweep">
      <rect x="612" y="716" width="100" height="24" rx="12" fill="#16233f" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="662" y="732" text-anchor="middle" fill="#c4b5fd" font-size="10.5">4 sites remontés</text>
    </g>
  </g>

  <!-- ================= PLAN D'ADRESSAGE ================= -->
  <g class="f" transform="translate(40,660)">
    <rect x="0" y="0" width="300" height="110" rx="14" fill="#0a1222" stroke="#22314f"/>
    <text x="16" y="24" class="t b" font-size="12">PLAN D'ADRESSAGE</text>
    <text x="16" y="48" class="m" font-size="11">SITE1-MG</text>
    <text x="170" y="48" fill="#7fe7f5" font-size="11">10.10.0.0/16</text>
    <text x="16" y="66" class="m" font-size="11">SITE2-MG</text>
    <text x="170" y="66" fill="#7fe7f5" font-size="11">10.20.0.0/16</text>
    <text x="16" y="84" class="m" font-size="11">SITE3-MG</text>
    <text x="170" y="84" fill="#7fe7f5" font-size="11">10.30.0.0/16</text>
    <text x="16" y="102" class="m" font-size="11">SITE4-MU</text>
    <text x="170" y="102" fill="#7fe7f5" font-size="11">10.40.0.0/16</text>
  </g>

  <!-- ================= SANTÉ SD-WAN ================= -->
  <g class="f" transform="translate(860,560)">
    <rect x="0" y="0" width="300" height="110" rx="14" fill="#0a1222" stroke="#22314f"/>
    <text x="16" y="24" class="t b" font-size="12">SD-WAN — SANTÉ DES FAI (site MG)</text>
    <text x="16" y="50" class="m" font-size="11">FO-TELMA</text>
    <rect x="96" y="40" width="180" height="8" rx="4" fill="#16233f"/>
    <rect x="96" y="40" width="164" height="8" rx="4" fill="#22c55e"/>
    <text x="16" y="72" class="m" font-size="11">FH-ORANGE</text>
    <rect x="96" y="62" width="180" height="8" rx="4" fill="#16233f"/>
    <rect x="96" y="62" width="132" height="8" rx="4" fill="#f5a524">
      <animate attributeName="width" values="132;96;150;110;132" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="94" class="m" font-size="11">STARLINK</text>
    <rect x="96" y="84" width="180" height="8" rx="4" fill="#16233f"/>
    <rect x="96" y="84" width="72" height="8" rx="4" fill="#22d3ee">
      <animate attributeName="width" values="72;104;60;88;72" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= LATENCE ================= -->
  <g class="f" transform="translate(860,690)">
    <rect x="0" y="0" width="300" height="90" rx="14" fill="#0a1222" stroke="#22314f"/>
    <text x="16" y="24" class="t b" font-size="12">LATENCE INTER-SITE (SLA)</text>
    <text x="16" y="54" fill="#22d3ee" font-size="20" class="b">18 ms</text>
    <text x="92" y="54" class="s" font-size="11">SITE1-MG ↔ SITE2 / SITE3 (MG)</text>
    <text x="16" y="78" fill="#f5a524" font-size="20" class="b">62 ms</text>
    <text x="92" y="78" class="s" font-size="11">SITE1-MG ↔ SITE4-MU (MU)</text>
  </g>
</svg>
